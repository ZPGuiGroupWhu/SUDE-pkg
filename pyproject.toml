[project]
name = "sude"
version = "0.2.0"
description = "A scalable manifold learning (SUDE) method that can cope with large-scale and high-dimensional data in an efficient manner."
readme = "README.md"
authors = [
    {name = "pdh", email = "pengdh@whu.edu.cn"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["manifold learning", "dimension reduction", "embedding", "landmark sampling"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "scikit-learn>=1.3.2",
    "numba>=0.57",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/ZPGuiGroupWhu/SUDE-pkg"
Repository = "https://github.com/ZPGuiGroupWhu/SUDE-pkg.git"
Issues = "https://github.com/ZPGuiGroupWhu/SUDE-pkg/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sude"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
addopts = "--color=yes"
testpaths = ["sude/tests"]

